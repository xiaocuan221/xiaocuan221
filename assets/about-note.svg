<svg xmlns="http://www.w3.org/2000/svg" width="660" height="210" viewBox="0 0 660 210" role="img" aria-labelledby="title desc">
  <title id="title">A little about me</title>
  <desc id="desc">坐标南宁，学过 C、Java、Web 和 SQL，也在写 ArkTS 和仓颉。 喜欢原生 Windows 应用，正在探索 AI Agent 的能力边界。 业余用 Blender 建模，喜欢用代码解决身边的小问题。</desc>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r=".8" style="fill:var(--rule)" opacity=".22"/>
    </pattern>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:var(--sky1)"/>
      <stop offset="1" style="stop-color:var(--sky2)"/>
    </linearGradient>
    
    <filter id="rough" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter><style>
      svg { --ink:#4E4133;--muted:#6E5C4A;--paper:#FFF8E9;--edge:#D3C6AA;--rule:#B6AB84;--green:#A7BB68;--deep:#7E9440;--blue:#8BC1C6;--gold:#F0CD79;--sky1:#DEEDF2;--sky2:#FBF7EA;--hill1:#C4E2A6;--blade:#6E9B45;--hill2:#A6D489;--fur:#FDF5E4;--furline:#8A6E4F;--blush:#F0B49A; }
      @media (prefers-color-scheme: dark) { svg { --ink:#FBEFD9;--muted:#D6C8AE;--paper:#2B2C25;--edge:#5B6150;--rule:#8A8668;--green:#A2BB76;--deep:#8DA652;--blue:#88B8BD;--gold:#EEC76C;--sky1:#243029;--sky2:#2B2C25;--hill1:#3A4B2E;--blade:#7C9B57;--hill2:#31402A;--fur:#F2E7CE;--furline:#C9B58F;--blush:#C98A72; } }
      text { font-family: "Segoe Print", "Bradley Hand", "Chalkboard SE", "Comic Sans MS", KaiTi, "Kaiti SC", "STKaiti", cursive; }
    </style></defs>
  <g transform="rotate(-1.1 330 105)">
    <rect x="6" y="8" width="648" height="196" rx="16" style="fill:var(--edge)" opacity=".45"/>
    <rect x="4" y="4" width="648" height="196" rx="16" style="fill:var(--paper)"/>
    <rect x="4" y="4" width="648" height="196" rx="16" fill="url(#dots)"/>
    <path d="M20 4H638A16 16 0 0 1 654 20V188A16 16 0 0 1 638 204H20A16 16 0 0 1 4 188V20A16 16 0 0 1 20 4Z" fill="none" style="stroke:var(--edge);stroke-width:1.8;" filter="url(#rough)"/>
    <rect x="274" y="0" width="112" height="24" rx="3" style="fill:var(--gold)" opacity=".7" transform="rotate(-2 330 12)"/>
    <text x="36" y="54" font-size="25" font-weight="700" style="fill:var(--ink)">A little about me</text>
    <path d="M36 63q38.55600000000002 -5 81.39600000000004 -1t85.68000000000005 2" fill="none"
        style="stroke:var(--green);stroke-width:2.6;stroke-linecap:round;" opacity=".9"/>
    <text x="36" y="88" font-size="18" style="fill:var(--ink)">坐标南宁，学过 C、Java、Web 和 SQL，也在写 ArkTS 和仓颉。</text>
    <text x="36" y="120" font-size="18" style="fill:var(--ink)">喜欢原生 Windows 应用，正在探索 AI Agent 的能力边界。</text>
    <text x="36" y="152" font-size="18" style="fill:var(--ink)">业余用 Blender 建模，喜欢用代码解决身边的小问题。</text>
    <path d="M614 192q12 -19 26 -23q-7 19 -19 26Z" fill="none"
          style="stroke:var(--green);stroke-width:1.8;stroke-linejoin:round;" opacity=".75"/>
  </g>
</svg>
