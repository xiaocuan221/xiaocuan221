name: Refresh profile cards

on:
  schedule:
    # 每天 UTC 02:17（北京时间 10:17）重画统计卡
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render cards from GitHub API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/build-profile.mjs --fetch

      - name: Commit updated assets
        run: |
          git add assets README.md
          if git diff --cached --quiet; then
            echo "统计没有变化，跳过提交"
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh profile cards'
          git push
